<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>草履シミュレーター</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page">
    <header class="hero">
      <h1>草履シミュレーター</h1>
      <p class="lead">鼻緒と天生地と台を選んで、お好みの組み合わせをお試しください。</p>
    </header>

    <main class="simulator">
      <section class="preview-section">
        <div class="preview">
          <img id="soko" src="./images/soko/1.png" alt="草履の台" fetchpriority="high">
          <img id="dai" src="./images/dai/1.png" alt="草履の天生地" fetchpriority="high">
          <img id="hanao" src="./images/hanao/1.png" alt="草履の鼻緒" fetchpriority="high">
        </div>

        <div id="current-selection">
          鼻緒：蔓小花(ピンク) / 天生地：墨織市松 / 台：アイボリー / サイズ：S
        </div>

        <div id="product-code" class="product-code">
          品番：01608111
        </div>
      </section>

      <section class="selector-section">
        <div class="selector-block">
          <div class="selector-header">
            <h2>鼻緒を選ぶ</h2>
          </div>

          <select id="hanao-filter-select" class="mobile-hanao-select" onchange="filterHanaoFromSelect(this.value)">
            <option value="" selected disabled>▼ 雰囲気で絞り込む</option>
            <option value="gorgeous">華やか</option>
            <option value="elegant">上品</option>
            <option value="simple">シンプル</option>
            <option value="cute">かわいい</option>
            <option value="calm">落ち着き</option>
            <option value="all">すべて</option>
          </select>

          <div class="filter-bar">
            <button type="button" class="filter-button active" onclick="filterHanao('all', this)">すべて</button>
            <button type="button" class="filter-button" onclick="filterHanao('gorgeous', this)">華やか</button>
            <button type="button" class="filter-button" onclick="filterHanao('elegant', this)">上品</button>
            <button type="button" class="filter-button" onclick="filterHanao('simple', this)">シンプル</button>
            <button type="button" class="filter-button" onclick="filterHanao('cute', this)">かわいい</button>
            <button type="button" class="filter-button" onclick="filterHanao('calm', this)">落ち着き</button>
          </div>

          <div id="hanao-grid" class="selector-grid"></div>

          <div class="more-wrap">
            <button type="button" id="more-button" class="more-button" onclick="showMoreHanao()">もっと見る</button>
          </div>
        </div>

        <div class="selector-block">
          <div class="selector-header">
            <h2>「天」生地を選ぶ</h2>
            <p class="selector-subtext">足を乗せていただくところの生地</p>
          </div>

          <select id="dai-filter-select" class="mobile-dai-select" onchange="filterDaiFromSelect(this.value)">
            <option value="" selected disabled>▼ 色で絞り込む</option>
            <option value="black">⚫ 黒系</option>
            <option value="white">⚪ 白系</option>
            <option value="gray">⬜ グレー系</option>
            <option value="beige">🟤 ベージュ系</option>
            <option value="red">🔴 赤系</option>
            <option value="orange">🟠 オレンジ系</option>
            <option value="brown">🟫 ブラウン系</option>
            <option value="pink">🩷 ピンク系</option>
            <option value="blue">🔵 青系</option>
            <option value="green">🟢 緑系</option>
            <option value="all">すべて</option>
          </select>

          <div class="filter-bar">
            <button type="button" class="filter-button filter-dai-all active" onclick="filterDai('all', this)">すべて</button>
            <button type="button" class="filter-button filter-dai-black" onclick="filterDai('black', this)">黒系</button>
            <button type="button" class="filter-button filter-dai-white" onclick="filterDai('white', this)">白系</button>
            <button type="button" class="filter-button filter-dai-gray" onclick="filterDai('gray', this)">グレー系</button>
            <button type="button" class="filter-button filter-dai-beige" onclick="filterDai('beige', this)">ベージュ系</button>
            <button type="button" class="filter-button filter-dai-red" onclick="filterDai('red', this)">赤系</button>
            <button type="button" class="filter-button filter-dai-orange" onclick="filterDai('orange', this)">オレンジ系</button>
            <button type="button" class="filter-button filter-dai-brown" onclick="filterDai('brown', this)">ブラウン系</button>
            <button type="button" class="filter-button filter-dai-pink" onclick="filterDai('pink', this)">ピンク系</button>
            <button type="button" class="filter-button filter-dai-blue" onclick="filterDai('blue', this)">青系</button>
            <button type="button" class="filter-button filter-dai-green" onclick="filterDai('green', this)">緑系</button>
          </div>

          <div id="dai-grid" class="selector-grid selector-grid-dai"></div>

          <div class="more-wrap">
            <button type="button" id="more-button-dai" class="more-button" onclick="showMoreDai()">もっと見る</button>
          </div>
        </div>

        <div class="selector-block">
          <div class="selector-header">
            <h2>台（草履の側面）を選ぶ</h2>
            <p class="selector-subtext">色から選択してください</p>
          </div>

          <div id="soko-grid" class="selector-grid selector-grid-soko"></div>
        </div>

        <div class="selector-block">
          <div class="selector-header">
            <h2>サイズを選ぶ</h2>
            <p class="selector-subtext">サイズを選択してください</p>
          </div>

          <div id="size-grid" class="selector-grid selector-grid-size"></div>
        </div>

        <div class="purchase-note">
          
          <a id="buy-link" href="https://item.rakuten.co.jp/yamako-02/td65eo6494/" target="_blank" rel="noopener noreferrer" class="buy-btn">
            品番をコピーして楽天へ進む
          </a>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
